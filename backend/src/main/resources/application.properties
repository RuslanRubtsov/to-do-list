spring.application.name=todo-backend

# Local default; Docker Compose overrides these with SPRING_DATASOURCE_* variables
spring.datasource.url=jdbc:mysql://localhost:3306/todo
spring.datasource.username=todo
spring.datasource.password=todo

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# A database the demo profile seeded still starts without the demo profile, which alone has the demo
# data migration
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

management.endpoints.web.exposure.include=health

# Behind the public demo's HTTPS proxy, take the browser's scheme and address from X-Forwarded-*.
# Tomcat trusts them only from private addresses, such as the Docker network the proxies are on;
# in production nothing else can reach the backend (docker-compose.prod.yml).
server.forward-headers-strategy=native
