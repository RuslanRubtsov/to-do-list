openapi: 3.0.3
info:
  title: To-Do API
  description: |
    REST API of the to-do application. This document is the contract: the Spring Boot
    controller interfaces and the Angular API client are both generated from it (ADR-0001).

    Every error response is an RFC 9457 Problem Details document carrying a stable,
    machine-readable `code`. The API never returns translated text (ADR-0002).

    Most endpoints need a bearer access token. To try them here, call **login** with
    **Try it out**, then paste the `accessToken` from its response into **Authorize**.
  version: 1.0.0
tags:
  - name: App Info
    description: Information about the running application.
  - name: Auth
    description: |
      Registering, logging in and logging out. Logging in returns a short-lived access token in
      the body and sets a long-lived refresh token as an `httpOnly` cookie that only the session
      endpoints receive.
  - name: Users
    description: The User making the request.
  - name: Todo Lists
    description: |
      The Todo Lists the User can access: those they own, and those Shared with them. A Todo List
      the User has no access to responds `404` (`NOT_FOUND`), exactly like one that doesn't
      exist, so its existence is never revealed. An action the User's role on it doesn't allow
      responds `403` (`FORBIDDEN`):

      | Action | Owner | Editor | Viewer |
      |---|---|---|---|
      | See the Todo List and its Tasks | yes | yes | yes |
      | Add, change, complete, move or delete Tasks | yes | yes | no |
      | Rename or delete the Todo List | yes | no | no |
      | Share the Todo List, see and change its Shares | yes | no | no |
      | Leave the Todo List | no | yes | yes |
  - name: Sharing
    description: |
      Sharing a Todo List with other Users, as Viewers or Editors. Only its Owner Shares it, sees
      whom it is Shared with, changes their roles and revokes their Shares; a User it is Shared
      with may leave it.
  - name: Dashboard
    description: |
      What needs attention across every Todo List the User can access: those they own and those
      Shared with them.
  - name: Events
    description: |
      Live updates: what changes in a Todo List, as it happens, for everyone who has it open.
  - name: Tasks
    description: |
      The Tasks of a Todo List. A Task is reached only through its own Todo List: one in another
      Todo List, or in one the User has no access to, responds `404` (`NOT_FOUND`).
security:
  - bearerAuth: []
paths:
  /api/v1/app-info:
    get:
      tags: [App Info]
      operationId: getAppInfo
      summary: Get the application name and version
      security: []
      responses:
        '200':
          description: The running application's name and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfo'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new User
      description: Creates a User without logging them in; log in afterwards.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The registered User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: A User with this email is already registered (`EMAIL_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; the refresh token is set as a cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: |
            The email or password is wrong (`INVALID_CREDENTIALS`). The response is the same
            whether or not the email is registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/session/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token with the refresh token cookie
      description: |
        Every refresh rotates the refresh token: the cookie is replaced with a new one and the
        presented token stops working. Presenting a token that was already rotated means it was
        copied, so the whole session (every token descended from the same login) is revoked.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '200':
          description: The session is still valid; the refresh token cookie is replaced.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshTokenCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: |
            No refresh token, or one that is unknown, expired, revoked or already rotated
            (`UNAUTHENTICATED`). The cookie is cleared, since the token can never work again.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshTokenCookie'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/session/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out, revoking the session
      description: |
        Revokes the session the refresh token belongs to, including every token it was rotated to
        or from. Always succeeds, so logging out twice, or without a session, is harmless.
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '204':
          description: Logged out; the refresh token cookie is cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshTokenCookie'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the User the access token belongs to
      responses:
        '200':
          description: The current User.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: Change the current User's display name or preferred language
      description: Changes only the fields given; the others keep their values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: The User as updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: What needs attention across the current User's Todo Lists
      description: |
        Counts of Tasks, and the open Tasks that are Overdue, due today, or due in the next 7 days,
        across every Todo List the User owns or that is Shared with them. Today is reckoned in the
        app's time zone. Each section lists at most 50 Tasks, soonest due first, then by Priority,
        High first; the counts are of all of them.
      responses:
        '200':
          description: The User's dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists:
    get:
      tags: [Todo Lists]
      operationId: getTodoLists
      summary: List the Todo Lists the current User can access
      description: |
        Those they own and those Shared with them, sorted by name. Each says the User's role on it
        and who owns it.
      responses:
        '200':
          description: The User's Todo Lists, each with its count of open Tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Todo Lists]
      operationId: createTodoList
      summary: Create a Todo List owned by the current User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoListDraft'
      responses:
        '201':
          description: The new Todo List.
          headers:
            Location:
              description: The new Todo List's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
    get:
      tags: [Todo Lists]
      operationId: getTodoList
      summary: Get a Todo List
      responses:
        '200':
          description: The Todo List.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Todo Lists]
      operationId: renameTodoList
      summary: Rename a Todo List
      description: Refused if someone else changed the Todo List since its `version` was read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoListRename'
      responses:
        '200':
          description: The renamed Todo List.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        '409':
          $ref: '#/components/responses/EditConflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Todo Lists]
      operationId: deleteTodoList
      summary: Delete a Todo List and all its Tasks
      description: Permanent. Clients offer an Undo by holding the request back for a few seconds.
      responses:
        '204':
          description: Deleted, together with its Tasks.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/shares:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
    get:
      tags: [Sharing]
      operationId: getShares
      summary: List whom a Todo List is Shared with
      description: Every Share of the Todo List, by display name. Only its Owner sees them.
      responses:
        '200':
          description: The Todo List's Shares.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Sharing]
      operationId: createShare
      summary: Share a Todo List with another User
      description: |
        Gives the registered User with this email the role of Viewer or Editor on the Todo List,
        with immediate effect: it is among their Todo Lists from then on. Only the Owner Shares a
        Todo List.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareDraft'
      responses:
        '201':
          description: The new Share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          description: |
            A field is invalid (`VALIDATION_FAILED`). Besides the constraints of the fields, the
            `email` may be refused as `NOT_REGISTERED`, when no User has it; `OWNER`, when it is the
            Owner's own; or `ALREADY_SHARED`, when the Todo List is already Shared with that User.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/shares/me:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
    delete:
      tags: [Sharing]
      operationId: leaveTodoList
      summary: Leave a Todo List Shared with the current User
      description: |
        Ends the current User's own Share, with immediate effect: the Todo List is no longer among
        theirs. Its Owner can't leave it (`403`).
      responses:
        '204':
          description: Left.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/shares/{userId}:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
      - name: userId
        in: path
        required: true
        description: The User the Todo List is Shared with.
        schema:
          type: integer
          format: int64
    patch:
      tags: [Sharing]
      operationId: changeShare
      summary: Change the role a Share gives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareChange'
      responses:
        '200':
          description: The changed Share.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Sharing]
      operationId: revokeShare
      summary: Revoke a Share
      description: With immediate effect, the User no longer has the Todo List among theirs.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ShareNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/events:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
    get:
      tags: [Events]
      operationId: getTodoListEvents
      summary: Follow a Todo List's changes as they happen
      description: |
        A Server-Sent Events stream of the Todo List's changes, each a `TodoListEvent` as JSON in
        an event's `data`, sent once the change is saved. Comment lines (`:`) are heartbeats that
        keep the stream open. Only Users who can still read the Todo List receive its events: one
        whose Share is revoked, or who leaves, receives `SHARE_REVOKED` and the stream ends; when
        the Todo List is deleted, everyone receives `TODO_LIST_DELETED` and the stream ends. The
        stream also ends now and then on its own: clients connect again, and read the Todo List
        again for what they missed meanwhile.
      responses:
        '200':
          description: The stream of the Todo List's events.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events, each with a `TodoListEvent` as its data.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/tasks:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
    get:
      tags: [Tasks]
      operationId: getTasks
      summary: Query a Todo List's Tasks, a page at a time
      description: |
        The Tasks matching every filter given, a page at a time. By default all of them, Completed
        or not, in their manual order: added Tasks go to the end, and moving a Task changes its
        place. Completing a Task keeps its place.
      parameters:
        - name: page
          in: query
          description: Which page, counting from 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: How many Tasks a page holds.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/TaskSort'
        - name: completed
          in: query
          description: Only Completed Tasks when `true`, only open ones when `false`.
          schema:
            type: boolean
        - name: priority
          in: query
          description: Only Tasks of any of these Priorities.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Priority'
        - name: dueFrom
          in: query
          description: Only Tasks due on this date or later.
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          description: Only Tasks due on this date or earlier.
          schema:
            type: string
            format: date
        - name: overdue
          in: query
          description: Only Overdue Tasks when `true`, only Tasks that aren't when `false`.
          schema:
            type: boolean
        - name: q
          in: query
          description: |
            Only Tasks with this text in their title or description, ignoring letter case. At most
            200 characters (`SIZE` otherwise).
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: A page of the matching Tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          description: A query parameter is invalid (`VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Add a Task to a Todo List
      description: The Task starts open, with Medium Priority and no Due Date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraft'
      responses:
        '201':
          description: The new Task.
          headers:
            Location:
              description: The new Task's URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TodoListNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a Task
      responses:
        '200':
          description: The Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Tasks]
      operationId: updateTask
      summary: Change a Task's details
      description: |
        Replaces the title, description, Due Date and Priority; a detail left out or `null` is
        cleared. Whether the Task is Completed is changed through its completion instead. Refused
        if someone else changed the Task since its `version` was read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDetails'
      responses:
        '200':
          description: The Task as changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/EditConflict'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a Task
      description: Permanent. Clients offer an Undo by holding the request back for a few seconds.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/tasks/{taskId}/move:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: moveTask
      summary: Move a Task before or after another Task
      description: |
        Changes the Task's place in its Todo List's manual order, the same for everyone. Needs no
        `version`, and makes no new one: a place isn't something anyone writes over. Placing a Task
        next to itself leaves it where it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMove'
      responses:
        '200':
          description: The moved Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: |
            The request is invalid (`VALIDATION_FAILED`), for example because `relativeTo` is no
            Task of this Todo List (`NOT_IN_TODO_LIST`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/todo-lists/{todoListId}/tasks/{taskId}/completion:
    parameters:
      - $ref: '#/components/parameters/TodoListId'
      - $ref: '#/components/parameters/TaskId'
    put:
      tags: [Tasks]
      operationId: completeTask
      summary: Mark a Task Completed
      description: |
        Sets `completedAt` to now. Completing a Task that is already Completed changes nothing, so
        it keeps the time it was first Completed. Needs no `version`: it sets the Task's state
        rather than replacing what someone else wrote, so it can't overwrite their change.
      responses:
        '200':
          description: The Completed Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Tasks]
      operationId: uncompleteTask
      summary: Mark a Task as not Completed
      description: |
        Clears `completedAt`. A Task that isn't Completed stays as it is. Like completing, it needs
        no `version`.
      responses:
        '200':
          description: The Task, open again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `accessToken` from logging in or refreshing the session.
  parameters:
    TodoListId:
      name: todoListId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RefreshTokenCookie:
      name: todo_refresh
      in: cookie
      required: false
      description: The refresh token set by logging in. Browsers send it automatically.
      schema:
        type: string
  headers:
    SetRefreshTokenCookie:
      description: |
        The refresh token: `todo_refresh=…; Path=/api/v1/auth/session; Max-Age=…; Secure;
        HttpOnly; SameSite=Strict`.
      schema:
        type: string
    ClearRefreshTokenCookie:
      description: Expires the refresh token cookie.
      schema:
        type: string
  responses:
    Unauthenticated:
      description: No valid access token (`UNAUTHENTICATED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TodoListNotFound:
      description: |
        No such Todo List, or one the current User has no access to (`NOT_FOUND`). The two are
        indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TaskNotFound:
      description: |
        No such Task in this Todo List, or a Todo List the current User has no access to
        (`NOT_FOUND`). The two are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        The current User's role on the Todo List doesn't allow this (`FORBIDDEN`): Viewers only
        read, and only the Owner renames, deletes or Shares a Todo List.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ShareNotFound:
      description: |
        The Todo List isn't Shared with that User, or there is no such Todo List, or the current
        User has no access to it (`NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EditConflict:
      description: |
        Someone else changed it since the `version` sent was read (`EDIT_CONFLICT`). Nothing was
        changed; read it again for the latest version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: An error, described as RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Logs the User in. No two Users share one, ignoring letter case.
          example: olena@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          pattern: '^(?=.*\p{L})(?=.*\p{N}).*$'
          description: |
            8 to 72 characters with at least one letter and one digit (`PATTERN` otherwise). It
            must also fit in the 72 bytes of UTF-8 that BCrypt hashes (`SIZE` otherwise).
          example: correct-horse-7
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: How the User is shown. Must not be blank (`PATTERN` otherwise).
          example: Olena
        preferredLanguage:
          $ref: '#/components/schemas/Language'
    ProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: How the User is shown. Must not be blank (`PATTERN` otherwise).
          example: Olena
        preferredLanguage:
          $ref: '#/components/schemas/Language'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: olena@example.com
        password:
          type: string
          example: correct-horse-7
    AuthSession:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: |
            A signed JWT to send as `Authorization: Bearer …`. Keep it in memory only.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, displayName, preferredLanguage]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        email:
          type: string
          example: olena@example.com
        displayName:
          type: string
          example: Olena
        preferredLanguage:
          $ref: '#/components/schemas/Language'
    Language:
      type: string
      description: |
        A language the UI is available in. A User's preferred one is what the app opens in after
        they log in, on any device. Registering without one prefers `en`.
      enum: [en, uk]
    TodoListDraft:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: |
            Stored without surrounding spaces. Must not be blank (`PATTERN` otherwise) or longer
            than 100 characters (`SIZE` otherwise).
          example: Groceries
    TodoListRename:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          description: |
            Stored without surrounding spaces. Must not be blank (`PATTERN` otherwise) or longer
            than 100 characters (`SIZE` otherwise).
          example: Shopping
        version:
          $ref: '#/components/schemas/Version'
    TodoList:
      type: object
      required: [id, name, openTaskCount, version, role, ownerDisplayName]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Groceries
        openTaskCount:
          type: integer
          description: How many of its Tasks are not Completed.
          example: 3
        version:
          $ref: '#/components/schemas/Version'
        role:
          $ref: '#/components/schemas/TodoListRole'
        ownerDisplayName:
          type: string
          description: The display name of the User who owns it.
          example: Olena
    Dashboard:
      type: object
      required: [counts, overdue, dueToday, upcoming]
      properties:
        counts:
          $ref: '#/components/schemas/DashboardCounts'
        overdue:
          type: array
          description: Open Tasks whose Due Date has passed.
          items:
            $ref: '#/components/schemas/DashboardTask'
        dueToday:
          type: array
          description: Open Tasks due today.
          items:
            $ref: '#/components/schemas/DashboardTask'
        upcoming:
          type: array
          description: Open Tasks due in the next 7 days, after today.
          items:
            $ref: '#/components/schemas/DashboardTask'
    DashboardCounts:
      type: object
      required: [open, overdue, dueToday, completedThisWeek]
      properties:
        open:
          type: integer
          description: Tasks not Completed.
          example: 12
        overdue:
          type: integer
          description: Open Tasks whose Due Date has passed.
          example: 2
        dueToday:
          type: integer
          description: Open Tasks due today.
          example: 3
        completedThisWeek:
          type: integer
          description: Tasks Completed since the start of this week, Monday.
          example: 5
    DashboardTask:
      type: object
      required: [task, todoList]
      properties:
        task:
          $ref: '#/components/schemas/Task'
        todoList:
          $ref: '#/components/schemas/DashboardTodoList'
    DashboardTodoList:
      type: object
      description: The Todo List a Task on the dashboard is in.
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Groceries
        role:
          $ref: '#/components/schemas/TodoListRole'
    TodoListEvent:
      type: object
      description: |
        A change to a Todo List, in its events stream. Which fields it has depends on its type:
        the Task changed for `TASK_*` events but `TASK_DELETED`, which has the `taskId`; the
        new `name` and `version` for `TODO_LIST_RENAMED`; the `userId` whose access ended for
        `SHARE_REVOKED`, sent when the Owner revokes a Share or its User leaves.
      required: [type, todoListId]
      properties:
        type:
          type: string
          enum:
            - TASK_CREATED
            - TASK_UPDATED
            - TASK_COMPLETED
            - TASK_UNCOMPLETED
            - TASK_MOVED
            - TASK_DELETED
            - TODO_LIST_RENAMED
            - TODO_LIST_DELETED
            - SHARE_REVOKED
        todoListId:
          type: integer
          format: int64
          example: 7
        task:
          $ref: '#/components/schemas/Task'
        taskId:
          type: integer
          format: int64
          example: 21
        name:
          type: string
          example: Shopping
        version:
          $ref: '#/components/schemas/Version'
        userId:
          type: integer
          format: int64
          example: 12
    TodoListRole:
      type: string
      description: |
        What the current User may do with a Todo List: `OWNER`, everything; `EDITOR`, change its
        Tasks; `VIEWER`, only read it.
      enum: [OWNER, EDITOR, VIEWER]
    ShareRole:
      type: string
      description: The role a Share gives, `VIEWER` (read only) or `EDITOR` (changes Tasks).
      enum: [VIEWER, EDITOR]
    ShareDraft:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          maxLength: 254
          description: The email of the registered User to Share with, ignoring letter case.
          example: taras@example.com
        role:
          $ref: '#/components/schemas/ShareRole'
    ShareChange:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/ShareRole'
    Share:
      type: object
      required: [userId, email, displayName, role]
      properties:
        userId:
          type: integer
          format: int64
          example: 12
        email:
          type: string
          example: taras@example.com
        displayName:
          type: string
          example: Taras
        role:
          $ref: '#/components/schemas/ShareRole'
    Version:
      type: integer
      format: int64
      description: |
        Which version of a Todo List or Task this is; every change to it makes a new one. A change
        sends the version it was based on, and is refused with `409 Conflict` (`EDIT_CONFLICT`) if
        that is no longer the latest, so no one silently overwrites someone else's change.
      example: 3
    TaskDraft:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: |
            Stored without surrounding spaces. Must not be blank (`PATTERN` otherwise) or longer
            than 200 characters (`SIZE` otherwise).
          example: Buy milk
    TaskDetails:
      type: object
      required: [title, priority, version]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: |
            Stored without surrounding spaces. Must not be blank (`PATTERN` otherwise) or longer
            than 200 characters (`SIZE` otherwise).
          example: Buy milk
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Stored without surrounding spaces; blank is stored as none. At most 2000 characters
            (`SIZE` otherwise).
          example: The oat one, two cartons.
        dueDate:
          type: string
          format: date
          nullable: true
          description: The date the Task should be Completed by; none when left out or `null`.
          example: '2026-11-03'
        priority:
          $ref: '#/components/schemas/Priority'
        version:
          $ref: '#/components/schemas/Version'
    Task:
      type: object
      required: [id, title, priority, overdue, version]
      properties:
        id:
          type: integer
          format: int64
          example: 12
        title:
          type: string
          example: Buy milk
        description:
          type: string
          nullable: true
          description: More about the Task; `null` when it has none.
          example: The oat one, two cartons.
        priority:
          $ref: '#/components/schemas/Priority'
        dueDate:
          type: string
          format: date
          nullable: true
          description: The date the Task should be Completed by; `null` when it has none.
          example: '2026-11-03'
        overdue:
          type: boolean
          description: |
            Whether the Due Date has passed while the Task isn't Completed: it is before today, in
            the time zone the backend is configured with. Derived on every read, never stored, so a
            Task due today isn't Overdue yet and a Completed Task never is.
          example: false
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: When the Task was Completed; `null` while it isn't.
          example: '2026-10-28T14:05:00Z'
        version:
          $ref: '#/components/schemas/Version'
    TaskSort:
      type: string
      description: |
        The order Tasks are listed in, each Task on a page keeping it across pages:
        `POSITION`, the manual order (the default); `DUE_DATE`, soonest first, then those with
        none; `PRIORITY`, High first; `TITLE`, alphabetically; `CREATED`, newest first. Tasks
        that tie keep their manual order.
      enum: [POSITION, DUE_DATE, PRIORITY, TITLE, CREATED]
    TaskPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
          description: Which page this is, counting from 0.
          example: 0
        size:
          type: integer
          description: How many Tasks a page holds; the last may hold fewer.
          example: 50
        totalItems:
          type: integer
          format: int64
          description: How many Tasks match, on all pages.
          example: 3
        totalPages:
          type: integer
          example: 1
    TaskMove:
      type: object
      required: [placement, relativeTo]
      properties:
        placement:
          $ref: '#/components/schemas/Placement'
        relativeTo:
          type: integer
          format: int64
          description: The other Task, in the same Todo List.
          example: 13
    Placement:
      type: string
      description: Whether a moved Task goes just before or just after the other Task.
      enum: [BEFORE, AFTER]
    Priority:
      type: string
      description: How important a Task is relative to others.
      enum: [LOW, MEDIUM, HIGH]
    AppInfo:
      type: object
      required: [name, version, buildTime]
      properties:
        name:
          type: string
          example: todo-backend
        version:
          type: string
          example: 0.1.0
        buildTime:
          type: string
          format: date-time
          description: When the running backend was built.
          example: '2026-10-27T09:35:00Z'
    Problem:
      type: object
      description: RFC 9457 Problem Details, extended with a stable error code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          description: Short, human-readable English summary. Clients must not display it; translate `code` instead.
          example: Bad Request
        status:
          type: integer
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          description: Present only when `code` is `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorCode:
      type: string
      description: Stable, machine-readable error code. Clients translate it for display.
      enum:
        - MALFORMED_REQUEST
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - EMAIL_TAKEN
        - FORBIDDEN
        - NOT_FOUND
        - EDIT_CONFLICT
        - METHOD_NOT_ALLOWED
        - NOT_ACCEPTABLE
        - UNSUPPORTED_MEDIA_TYPE
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Path of the invalid field in the request, e.g. `name` or `items[0].title`.
          example: name
        code:
          type: string
          description: |
            The violated constraint in UPPER_SNAKE_CASE, derived from the Bean Validation
            constraint name, e.g. `NOT_BLANK`, `SIZE`, `EMAIL`, `PATTERN`, or named for a rule
            only the backend can check, e.g. `NOT_IN_TODO_LIST`.
          example: NOT_BLANK
