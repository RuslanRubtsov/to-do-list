<h2 mat-dialog-title i18n="Dialog heading: confirming that a Todo List is to be deleted">
  Delete “{{ todoList.name }}”?
</h2>
<mat-dialog-content>
  <p i18n="Dialog text: what deleting a Todo List does">
    The Todo List and all its Tasks will be deleted.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    matButton
    type="button"
    mat-dialog-close
    cdkFocusInitial
    i18n="Button: close a dialog without saving"
  >
    Cancel
  </button>
  <button
    matButton="filled"
    type="button"
    [mat-dialog-close]="true"
    i18n="Button: confirm deleting"
  >
    Delete
  </button>
</mat-dialog-actions>
