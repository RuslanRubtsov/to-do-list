# Serves the app and proxies the backend so the browser sees a single origin.

# Ukrainian when the browser lists it before any English, English otherwise (ADR-0002).
# The lookahead skips every language before the first "uk" as long as none of them is English.
# This relies on list order rather than q-values, which holds for browsers: they send languages
# in preference order, with descending q-values.
map $http_accept_language $preferred_locale {
  default en;
  "~*^(?:(?!\s*en\b)[^,]*,)*\s*uk\b" uk;
}

# The scheme the browser used: behind the public demo's HTTPS proxy (docs/deployment.md), the one
# that proxy forwards, otherwise this connection's own
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects keep whatever host and port the browser used (Compose may remap the port)
  absolute_redirect off;

  # Docker's embedded DNS, for the per-request lookup in backend-proxy.inc
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The API, plus Swagger UI and the hand-written spec it renders (ADR-0001).
  # Keep in step with proxy.conf.json, which does the same for `ng serve`.
  location ^~ /api/ {
    include /etc/nginx/conf.d/backend-proxy.inc;
  }
  location ^~ /swagger-ui/ {
    include /etc/nginx/conf.d/backend-proxy.inc;
  }
  location ^~ /webjars/ {
    include /etc/nginx/conf.d/backend-proxy.inc;
  }
  location = /openapi.yaml {
    include /etc/nginx/conf.d/backend-proxy.inc;
  }

  # Hashed build output never changes under the same name
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # One build per locale (ADR-0002); client-side routes all load that locale's app
  location ~ ^/(en|uk)$ {
    return 302 /$1/;
  }
  location /en/ {
    try_files $uri $uri/ /en/index.html;
    add_header Cache-Control "no-cache";
  }
  location /uk/ {
    try_files $uri $uri/ /uk/index.html;
    add_header Cache-Control "no-cache";
  }

  # Anything outside a locale, including the root, goes to the preferred locale's copy of it
  location / {
    add_header Vary Accept-Language;
    return 302 /$preferred_locale$request_uri;
  }
}
