name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check formatting
        run: ./mvnw -B spotless:check
      # verify builds, runs the tests against MySQL in Testcontainers and writes the JaCoCo report
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # openapi-generator, which generates the API client, runs on the JVM
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      # Fails when any message lacks a Ukrainian translation (ADR-0002)
      - name: Check translations
        run: npm run i18n:check
      - name: Test
        run: npm test -- --watch=false --coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
      # One build per locale; also fails on any message missing from a translation file
      - name: Production build
        run: npm run build

  docker:
    name: Docker images (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # The public demo's server is an Arm VM (docs/deployment.md)
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Check the production configuration
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet
